name: Import faster-whisper master

on:
  push:
    paths:
      - '.github/workflows/import-faster-whisper-master.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TCRM patches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import pinned faster-whisper source
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA='ed9a06cd89a93e47838f564998a6c09b655d7f43'
          DEST='patches/faster-whisper-master'
          TMP="$(mktemp -d)"
          ZIP="$TMP/faster-whisper.zip"

          test ! -e "$DEST"
          curl -fL --retry 3 \
            "https://github.com/SYSTRAN/faster-whisper/archive/${UPSTREAM_SHA}.zip" \
            -o "$ZIP"
          unzip -q "$ZIP" -d "$TMP/src"
          SRC="$(find "$TMP/src" -mindepth 1 -maxdepth 1 -type d -name 'faster-whisper-*' | head -n 1)"
          test -n "$SRC"

          mkdir -p "$DEST"
          cp -a "$SRC/." "$DEST/"

          test -f "$DEST/faster_whisper/version.py"
          grep -Fq '__version__ = "1.2.1"' "$DEST/faster_whisper/version.py"
          test "$(stat -c %s "$DEST/faster_whisper/assets/silero_vad_v6.onnx")" = '1249744'
          test "$(stat -c %s "$DEST/faster_whisper/vad.py")" = '13963'
          test "$(stat -c %s "$DEST/faster_whisper/utils.py")" = '4897'

          rm -f '.github/workflows/import-faster-whisper-master.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST" '.github/workflows/import-faster-whisper-master.yml'
          git commit -m 'Add faster-whisper master source to patches'
          git push origin HEAD:main
